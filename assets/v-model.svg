<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="system-ui, sans-serif" font-size="12">
  <title>Consistency and bidirectional traceability along the system and software V</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a2c1d"/>
    </marker>
  </defs>
  <style>
    .box { fill: #fffdf8; stroke: #1f1d1a; stroke-width: 1; }
    .sys { fill: #f5f0e6; }
    .t { fill: #1f1d1a; text-anchor: middle; }
    .p { fill: #6b665e; text-anchor: middle; font-size: 10px; }
    .down { stroke: #8a2c1d; stroke-width: 1.4; fill: none; marker-start: url(#a); marker-end: url(#a); }
    .across { stroke: #8a2c1d; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; marker-start: url(#a); marker-end: url(#a); }
  </style>

  <!-- left leg -->
  <rect class="box sys" x="20" y="20" width="150" height="38" rx="3"/><text class="t" x="95" y="37">Stakeholder reqs</text><text class="p" x="95" y="51">SYS.1</text>
  <rect class="box sys" x="60" y="85" width="150" height="38" rx="3"/><text class="t" x="135" y="102">System reqs</text><text class="p" x="135" y="116">SYS.2</text>
  <rect class="box sys" x="100" y="150" width="150" height="38" rx="3"/><text class="t" x="175" y="167">System architecture</text><text class="p" x="175" y="181">SYS.3</text>
  <rect class="box" x="140" y="215" width="150" height="38" rx="3"/><text class="t" x="215" y="232">SW requirements</text><text class="p" x="215" y="246">SWE.1</text>
  <rect class="box" x="180" y="280" width="150" height="38" rx="3"/><text class="t" x="255" y="297">SW architecture</text><text class="p" x="255" y="311">SWE.2</text>
  <rect class="box" x="285" y="330" width="150" height="38" rx="3"/><text class="t" x="360" y="347">Detailed design + units</text><text class="p" x="360" y="361">SWE.3</text>

  <!-- right leg -->
  <rect class="box sys" x="550" y="85" width="150" height="38" rx="3"/><text class="t" x="625" y="102">System verification</text><text class="p" x="625" y="116">SYS.5</text>
  <rect class="box sys" x="510" y="150" width="150" height="38" rx="3"/><text class="t" x="585" y="167">System integration verif.</text><text class="p" x="585" y="181">SYS.4</text>
  <rect class="box" x="470" y="215" width="150" height="38" rx="3"/><text class="t" x="545" y="232">SW verification</text><text class="p" x="545" y="246">SWE.6</text>
  <rect class="box" x="425" y="280" width="170" height="38" rx="3"/><text class="t" x="510" y="297">Component/integration verif.</text><text class="p" x="510" y="311">SWE.5</text>
  <rect class="box" x="455" y="330" width="150" height="38" rx="3"/><text class="t" x="530" y="347">Unit verification</text><text class="p" x="530" y="361">SWE.4</text>

  <!-- down the left leg -->
  <path class="down" d="M95,58 L120,85"/>
  <path class="down" d="M135,123 L160,150"/>
  <path class="down" d="M175,188 L200,215"/>
  <path class="down" d="M215,253 L240,280"/>
  <path class="down" d="M255,318 L300,330"/>
  <!-- SWE.1 also traces to the system requirements (SWE.1.BP5) -->
  <path class="down" d="M75,123 C45,180 80,236 140,240"/>

  <!-- across the V -->
  <path class="across" d="M210,104 L550,104"/>
  <path class="across" d="M250,169 L510,169"/>
  <path class="across" d="M290,234 L470,234"/>
  <path class="across" d="M330,299 L425,299"/>
  <path class="across" d="M435,349 L455,349"/>
  <!-- SWE.5 verification also traces to the detailed design (SWE.5.BP6) -->
  <path class="across" d="M420,330 L445,318"/>

  <text x="360" y="96" class="p">SYS.5.BP4</text>
  <text x="380" y="161" class="p">SYS.4.BP4</text>
  <text x="380" y="226" class="p">SWE.6.BP4</text>
  <text x="380" y="291" class="p">SWE.5.BP6</text>
</svg>
